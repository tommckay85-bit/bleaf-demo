name: Update fixtures

# Pulls Premier League fixtures & results from the free Fantasy Premier League
# API (no key needed) and commits them to data/fixtures.json on gh-pages.
# The app reads that file via raw.githubusercontent.com, so a push shows up
# in the app within seconds.
#
# GitHub throttles frequent cron schedules heavily (a */5 cron can fire only
# every few hours), so rapid updates can't come from the scheduler. Instead,
# each run LOOPS while any match is in play: refetch every 2 minutes and push
# whenever the data changes, for up to ~5.5 hours. The crons below just make
# sure a looper is (re)started around match windows; concurrency cancels the
# old one when a new run begins.

# Cron notes: GitHub heavily throttles schedules, and :00 is the most
# congested (= most-skipped) minute, so these fire twice an hour on odd
# minutes. Combined with the 75-minute pre-kickoff window in any_live,
# missing several fires in a row still leaves a looper running.
on:
  schedule:
    - cron: '7,37 10-22 * * 6'      # Saturday: every 30 min, 11am-11pm UK
    - cron: '7,37 16-22 * * 5'      # Friday evening: every 30 min
    - cron: '7,37 11-21 * * 0'      # Sunday: every 30 min
    - cron: '7,37 17-21 * * 1-4'    # weekday evenings (midweek rounds)
    - cron: '23 6,12,22 * * *'      # daily housekeeping (postponements, new GWs)
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/update-fixtures.yml

permissions:
  contents: write

concurrency:
  group: update-fixtures
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch, publish, and loop while matches are live
        run: |
          set -u
          git config user.name "fixtures-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          fetch_feed() {
            curl -fsS --retry 3 --retry-delay 5 \
              -H "User-Agent: prediction-league-fixture-bot" \
              https://fantasy.premierleague.com/api/bootstrap-static/ -o /tmp/bootstrap.json \
            && curl -fsS --retry 3 --retry-delay 5 \
              -H "User-Agent: prediction-league-fixture-bot" \
              https://fantasy.premierleague.com/api/fixtures/ -o /tmp/fixtures.json
          }

          build_feed() {
            mkdir -p data
            # key match facts only: goals, own goals, red cards, penalties
            jq -n --slurpfile b /tmp/bootstrap.json --slurpfile f /tmp/fixtures.json '
              def keystat: .identifier as $k
                | ["goals_scored","own_goals","red_cards","penalties_missed","penalties_saved"] | index($k);
              ([$f[0][] | (.stats // [])[] | select(keystat) | (.h[], .a[]) | .element] | unique) as $ids
              | {
              updated: (now | todate),
              source: "fantasy.premierleague.com",
              teams: ($b[0].teams | map({ key: (.id|tostring),
                                          value: { name: .name, short: .short_name, code: .code } }) | from_entries),
              players: ($b[0].elements | map(select(.id as $i | $ids | index($i)))
                        | map({ key: (.id|tostring), value: .web_name }) | from_entries),
              fixtures: ($f[0] | map({
                id: .id,
                gw: .event,
                kickoff: .kickoff_time,
                h: .team_h,
                a: .team_a,
                hs: .team_h_score,
                as: .team_a_score,
                min: .minutes,
                finished: (.finished or .finished_provisional),
                stats: ((.stats // []) | map(select(keystat))
                        | map({ k: .identifier, h: .h, a: .a })
                        | map(select((.h|length) + (.a|length) > 0)))
              } | if (.stats | length) == 0 then del(.stats) else . end))
            }' > data/fixtures.json
            jq -e '.fixtures | length > 0' data/fixtures.json > /dev/null
          }

          publish() {
            # push, and on a race (another push landed) rebuild on top and retry
            for i in 1 2 3; do
              git add data/fixtures.json
              if git diff --cached --quiet; then echo "No changes."; return 0; fi
              git commit -m "Update fixtures data"
              if git push; then return 0; fi
              git fetch origin gh-pages
              git reset --hard origin/gh-pages
              build_feed
            done
            echo "publish: giving up after 3 attempts" >&2
            return 1
          }

          # true while any game kicked off in the last 3h isn't finished, or
          # kicks off within the next 75 minutes — wide enough that a cron
          # fire well before kickoff stays alive into the match even when
          # GitHub throttles away the fires closer to kickoff
          any_live() {
            jq -e --argjson now "$(date -u +%s)" '
              [ .fixtures[]
                | select(.kickoff != null) | select(.finished | not)
                | (.kickoff | fromdateiso8601) as $ko
                | select($now >= ($ko - 4500) and $now <= ($ko + 10800)) ]
              | length > 0' data/fixtures.json > /dev/null
          }

          fetch_feed && build_feed && publish

          deadline=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ] && any_live; do
            echo "Match in play — refreshing in 2 minutes..."
            sleep 120
            fetch_feed && build_feed && publish || true
          done
