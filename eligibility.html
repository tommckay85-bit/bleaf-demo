<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Eligibility check — True Leaf by Boots Online Doctor</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="A free, confidential check to see whether a specialist medical cannabis consultation may be right for you. Not a guarantee of a prescription."/>
<link rel="icon" type="image/svg+xml" href="assets/trueleaf-icon.svg"/>
<link rel="stylesheet" href="trueleaf.css?v=20260626-3"/>
<style>
/* ---- Eligibility checker (scoped) ---- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.chk-wrap{background:var(--bg-cool);min-height:calc(100vh - 70px);padding:40px 20px 80px}
.chk-card{max-width:680px;margin:0 auto;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:0;overflow:hidden}
.chk-top{padding:22px 32px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}
.chk-top .pct{font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.chk-bar{flex:1;height:8px;background:var(--bg-cool-2);border-radius:99px;overflow:hidden}
.chk-bar > span{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .3s ease}
.chk-body{padding:32px 36px 36px}
.chk-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--leaf);margin:0 0 10px}
.chk-q{font-size:26px;line-height:1.15;color:var(--navy);font-weight:700;margin:0 0 8px}
.chk-help{font-size:15px;color:var(--body);margin:0 0 22px;line-height:1.55}
.chk-options{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;border:0}
.opt{display:flex;align-items:flex-start;gap:13px;border:2px solid var(--line);border-radius:14px;
  padding:15px 17px;cursor:pointer;font-size:16px;font-weight:600;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--navy-soft)}
.opt input{margin:2px 0 0;width:20px;height:20px;accent-color:var(--navy);flex-shrink:0}
.opt.sel{border-color:var(--navy);background:var(--bg-cool)}
.opt .opt-sub{display:block;font-weight:400;font-size:13.5px;color:var(--mute);margin-top:3px}
.chk-fieldset{margin-bottom:30px}
.chk-fieldset:last-child{margin-bottom:0}
.chk-sub{font-size:18px;font-weight:700;color:var(--navy);margin:0 0 13px;line-height:1.3}
.chk-inline{display:none;margin-top:14px;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55}
.chk-inline.show{display:block}
.chk-inline.warn{background:#FFF4DD;border:1px solid #f0d28a;color:#6b531a}
.chk-inline.stop{background:#FDECEA;border:1px solid #f3b8b1;color:#7a241c}
.chk-field{margin-top:16px}
.chk-field label{display:block;font-size:14px;font-weight:700;color:var(--navy);margin-bottom:7px}
.chk-input,.chk-text{width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  border:2px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff}
.chk-input:focus,.chk-text:focus,.opt:focus-within{outline:none;border-color:var(--navy)}
.chk-text{min-height:92px;resize:vertical}
.chk-check{display:flex;align-items:flex-start;gap:13px;border:2px solid var(--line);border-radius:14px;
  padding:16px 17px;cursor:pointer;font-size:15px;color:var(--ink);line-height:1.5;margin-top:12px}
.chk-check input{margin:2px 0 0;width:20px;height:20px;accent-color:var(--leaf);flex-shrink:0}
.chk-check.sel{border-color:var(--leaf);background:var(--leaf-tint)}
.chk-note{background:var(--bg-cool);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--body);line-height:1.6;margin:0 0 22px}
.chk-note strong{color:var(--navy)}
.chk-err{color:#b3261e;font-size:14px;font-weight:700;margin-top:14px;min-height:20px}
.chk-actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:28px}
.chk-back{background:none;border:0;font-family:inherit;font-size:15px;font-weight:700;color:var(--mute);cursor:pointer;padding:10px}
.chk-back:hover{color:var(--navy)}
.chk-back[hidden]{visibility:hidden}
.chk-privacy{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--mute);margin-top:18px}
/* outcome */
.oc{text-align:center}
.oc .badge{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:30px;margin:4px auto 18px}
.oc.pos .badge{background:var(--leaf-tint)}
.oc.cav .badge{background:#FFF4DD}
.oc.neg .badge{background:#FDECEA}
.oc.stop .badge{background:#FDECEA}
.oc h2{font-size:27px;color:var(--navy);margin:0 0 14px}
.oc p{font-size:16px;color:var(--body);line-height:1.6;margin:0 auto 16px;max-width:520px}
.oc .warnbox{background:#FFF4DD;border:1px solid #f0d28a;border-radius:12px;padding:16px 18px;text-align:left;
  font-size:14.5px;color:#6b531a;line-height:1.55;margin:0 auto 20px;max-width:540px}
.oc .warnbox.red{background:#FDECEA;border-color:#f3b8b1;color:#7a241c}
.oc .oc-cta{margin-top:10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.oc .contact-grid{display:grid;gap:14px;text-align:left;max-width:480px;margin:0 auto 8px}
.oc .contact-grid .chk-field{margin-top:0}
.oc .muted-cta{font-size:14px}
/* answer summary */
.oc-summary{list-style:none;margin:6px auto 24px;padding:0;max-width:560px;text-align:left;display:flex;flex-direction:column;gap:10px}
.sm{display:grid;grid-template-columns:26px 1fr;gap:13px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:13px 16px;background:#fff}
.sm-ic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.sm.green .sm-ic{background:var(--leaf-tint);color:var(--leaf)}
.sm.amber{border-color:#f0d28a}
.sm.amber .sm-ic{background:#FFF4DD;color:#9a6b00}
.sm.red{border-color:#f3b8b1;background:#fef7f6}
.sm.red .sm-ic{background:#FDECEA;color:#b3261e}
.sm-label{font-weight:700;color:var(--navy);font-size:14.5px}
.sm-val{color:var(--body);font-size:14.5px;margin-left:6px}
.sm-note{display:block;color:var(--mute);font-size:13px;margin-top:3px;line-height:1.45}
@media (max-width:560px){
  .chk-body{padding:26px 22px 30px}
  .chk-top{padding:18px 22px}
  .chk-q{font-size:22px}
  .oc h2{font-size:23px}
}
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <div class="nav-row">
    <a class="brand" href="index.html" aria-label="True Leaf by Boots Online Doctor">
      <img class="mark" src="assets/trueleaf-icon.svg" alt=""/>
      <span class="wm">
        <span class="name">True<span class="leaf">Leaf</span></span>
        <span class="by">by Boots Online Doctor</span>
      </span>

    <div class="nav-right">
      <a class="nav-login" href="pricing.html">Pricing</a>
      <a class="btn btn-ghost" href="index.html">Exit check</a>
    </div>
  </div>
</nav>

<main class="chk-wrap">
  <div class="chk-card">
    <div class="chk-top">
      <div class="chk-bar"><span id="chkBar"></span></div>
      <div class="pct" id="chkPct">Start</div>
    </div>
    <div class="chk-body">
      <div id="chkScreen" aria-live="polite"></div>
      <div class="chk-err" id="chkErr" role="alert"></div>
      <div class="chk-actions" id="chkActions">
        <button type="button" class="chk-back" id="chkBack" hidden>← Back</button>
        <button type="button" class="btn btn-primary" id="chkNext">Continue</button>
      </div>
      <div class="chk-privacy">🔒 Confidential · your answers are used only to assess suitability</div>
    </div>
  </div>
</main>

<script>
/* ============================================================
   ELIGIBILITY CHECKER — True Leaf (demo)
   A pre-booking suitability screen. NOT a guarantee of a prescription.

   WHERE TO CHANGE THINGS
   - Questions & options ........ STEPS array
   - Gate logic (blockers) ...... evaluate()  +  the per-step `gate` flags
   - Outcome wording ............ OUTCOMES object
   - All copy is in these constants so non-devs can review it.

   DECISION LOGIC (mirrors the spec)
     HARD_STOP if age == "Under 18"
     else blockers = any of:
         treatments_tried == "No"
         residency == "No"
         pregnancy == "Yes"
         psychosis == "Yes"
         records_consent == false
         acknowledgements not all checked
     if blockers -> NEGATIVE
     else if age == "18–25" -> CAVEATED_PASS
     else -> POSITIVE
   TODO(team): confirm whether NEGATIVE routes to the same booking flow or a
   separate "review" booking type. Confirm refund wording with compliance.
   TODO(team): wire "Book an appointment" to the real booking system.
   ============================================================ */

var ACK_ITEMS = [
  'Prescribed cannabis flower must be vaporised — smoking it remains illegal.',
  'THC can affect your ability to drive or operate machinery.',
  'Completing this check does not guarantee a prescription — the decision rests with the specialist.'
];

/* Each step has one OR MORE fields (combine related questions onto one screen). */
var STEPS = [
  { id:'consent', eyebrow:'Before we start', q:'A quick note on your privacy',
    help:'The questions that follow ask about your health. Your answers are special-category data and are used only to assess whether a specialist consultation may be suitable for you. We won’t store anything until you’ve agreed to continue, and completing this check never guarantees a prescription.',
    fields:[ {key:'consent', type:'consent', checkLabel:'I understand, and I want to continue.'} ] },

  { id:'condition', eyebrow:'About you', q:'What are you seeking treatment for?',
    help:'Pick the closest match — there are no wrong answers here.',
    fields:[ {key:'condition', type:'single', other:true,
      options:['Chronic / neuropathic pain','Anxiety','Depression','PTSD','ADHD','Arthritis','Fibromyalgia','Crohn’s disease','Insomnia','Migraine','Endometriosis','Other'],
      notices:{ 'Other':{type:'warn', text:'We can currently only prescribe for the conditions listed above, so we’re unlikely to be able to help — but you’re welcome to continue if you’d like.'} } } ] },

  { id:'treatments', eyebrow:'Your treatment history',
    q:'Have you tried at least two conventional treatments without adequate relief — or had to stop them due to side effects?',
    help:'This is the most important question. UK specialists can usually only consider cannabis-based medicine once other licensed treatments haven’t worked well enough for you.',
    fields:[ {key:'treatments', type:'single', options:['Yes','No'],
      notices:{ 'No':{type:'warn', text:'Specialists usually can’t prescribe until at least two other treatments haven’t worked, so we’re unlikely to be able to approve treatment — you can still continue if you’d like.'} } } ] },

  { id:'about', eyebrow:'A few quick checks', q:'A little about you',
    fields:[
      {key:'age', label:'How old are you?', type:'single', options:['Under 18','18–25','Over 25'],
        notices:{
          'Under 18':{type:'stop', outcome:'HARD_STOP', text:'We’re sorry — we’re unable to offer this service to anyone under 18, so there’s no need to go any further.'},
          '18–25':{type:'warn', text:'Heads-up: we only treat patients aged 18–25 in exceptional circumstances, so you may not be accepted — and the appointment fee isn’t refunded if a specialist finds you unsuitable. You’re welcome to continue if you’d like.'}
        } },
      {key:'residency', label:'Are you a UK resident with a UK GP?', type:'single', options:['Yes','No'],
        notices:{ 'No':{type:'warn', text:'We can only prescribe for UK residents who have a UK GP, so we’re unlikely to be able to prescribe for you.'} } }
    ] },

  { id:'health', eyebrow:'A few quick checks', q:'A little about your health',
    fields:[
      {key:'pregnancy', label:'Are you currently pregnant, trying to conceive, or breastfeeding?', type:'single', options:['Yes','No','Prefer not to say / N/A'],
        notices:{ 'Yes':{type:'danger', text:'We don’t prescribe cannabis-based medicines during pregnancy, while trying to conceive, or while breastfeeding — so we won’t be able to prescribe for you.'} } },
      {key:'psychosis', label:'Any personal or family history of psychosis or schizophrenia?', type:'single', options:['Yes','No'],
        notices:{ 'Yes':{type:'warn', text:'A personal or family history of psychosis or schizophrenia means we’re unlikely to be able to prescribe for you.'} } }
    ] },

  { id:'records', eyebrow:'Consent', q:'Access to your medical records',
    help:'Safe prescribing isn’t possible without sight of your records, so this is required to proceed.',
    fields:[
      {key:'records', type:'check', gate:{requireChecked:true},
        checkLabel:'I agree to you accessing my Summary Care Record (England) or confirm that I can provide evidence of my medical history (Scotland, Wales and NI).'}
    ] },

  { id:'acks', eyebrow:'Please confirm you understand', q:'A few important points',
    fields:[ {key:'acks', type:'acks', items:ACK_ITEMS, gate:{requireAll:true}} ] }
];

var OUTCOMES = {
  // overall GREEN — nothing of concern
  GREEN: {
    cls:'pos', icon:'✓',
    heading:'Good news — you may be suitable for a consultation',
    body:'Based on your answers below, a consultation with one of our specialists may be appropriate. This isn’t a guarantee of a prescription — ultimately it will be a joint decision between you and one of our clinicians after a full assessment.',
    contact:true, ctaLabel:'Book an appointment', ctaPrimary:true
  },
  // overall AMBER — one or more "unlikely" factors
  AMBER: {
    cls:'cav', icon:'!',
    heading:'You can book — but you may not be suitable',
    body:'Some of your answers below mean a specialist may not be able to prescribe for you. You’re welcome to book a consultation, but please note that if the specialist finds you unsuitable, your appointment fee won’t be refunded.',
    contact:true, ctaLabel:'Book an appointment anyway', ctaPrimary:false
  },
  // overall RED — a definite blocker (e.g. pregnancy)
  RED: {
    cls:'neg', icon:'×',
    heading:'We’re not able to prescribe right now',
    body:'Based on the answer(s) highlighted in red below, we’re not able to offer treatment at this time. If you’re struggling with your health, please speak to your GP.',
    contact:false, ctaLabel:null
  },
  // under 18 — immediate, no booking
  HARD_STOP: {
    cls:'stop', icon:'×',
    heading:'We’re unable to help',
    body:'Unfortunately we are not able to offer this service to anyone under 18. If you’re struggling with your health, please speak to your GP.',
    contact:false, ctaLabel:null
  }
};

/* ---- state + elements ---- */
var state = { i:0, answers:{} };
var screenEl = document.getElementById('chkScreen');
var errEl    = document.getElementById('chkErr');
var backBtn  = document.getElementById('chkBack');
var nextBtn  = document.getElementById('chkNext');
var barEl    = document.getElementById('chkBar');
var pctEl    = document.getElementById('chkPct');
var actionsEl= document.getElementById('chkActions');
var finished = false;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function setProgress(){
  var pct = Math.round((state.i/STEPS.length)*100);
  barEl.style.width = pct+'%';
  pctEl.textContent = 'Step '+(state.i+1)+' of '+STEPS.length;
}

function fieldByKey(step,key){ return step.fields.filter(function(f){return f.key===key;})[0]; }

function render(){
  finished=false; errEl.textContent=''; actionsEl.style.display='flex';
  var step=STEPS[state.i], html='';
  html += '<p class="chk-eyebrow">'+esc(step.eyebrow||'')+'</p>';
  html += '<h1 class="chk-q">'+esc(step.q)+'</h1>';
  if(step.help) html += '<p class="chk-help">'+esc(step.help)+'</p>';
  step.fields.forEach(function(field){ html += renderField(field, state.answers[field.key]); });
  screenEl.innerHTML = html;

  backBtn.hidden = state.i===0;
  setNextLabel();
  setProgress();
  wire(step);
  var first = screenEl.querySelector('input,textarea,select');
  if(first) first.focus();
}

function renderField(field, a){
  var h='<div class="chk-fieldset" data-field="'+field.key+'">';
  if(field.label) h+='<p class="chk-sub">'+esc(field.label)+'</p>';
  if(field.type==='consent' || field.type==='check'){
    var on=a===true;
    h+='<label class="chk-check'+(on?' sel':'')+'"><input type="checkbox" class="f-check"'+(on?' checked':'')+'/> <span>'+esc(field.checkLabel)+'</span></label>';
  }
  else if(field.type==='single'){
    h+='<fieldset class="chk-options"><legend class="sr-only">'+esc(field.label||'')+'</legend>';
    field.options.forEach(function(opt){
      var sel=a&&a.value===opt;
      h+='<label class="opt'+(sel?' sel':'')+'"><input type="radio" name="r_'+field.key+'" value="'+esc(opt)+'"'+(sel?' checked':'')+'/> <span>'+esc(opt)+'</span></label>';
    });
    h+='</fieldset>';
    if(field.other){ var so=a&&a.value==='Other';
      h+='<div class="chk-field f-other" style="'+(so?'':'display:none')+'"><label>Tell us a little more</label><input class="chk-input f-othertext" type="text" value="'+esc(a&&a.other||'')+'"/></div>'; }
    if(field.followup){ var sf=a&&a.value===field.followup.when;
      h+='<div class="chk-field f-fu" style="'+(sf?'':'display:none')+'"><label>'+esc(field.followup.label)+'</label><textarea class="chk-text f-futext" placeholder="Optional">'+esc(a&&a.followup||'')+'</textarea></div>'; }
    if(field.notices){ h+='<div class="chk-inline" data-noticefor="'+field.key+'"></div>'; }
  }
  else if(field.type==='text'){
    h+='<textarea class="chk-text f-text" placeholder="'+esc(field.placeholder||'')+'">'+esc(a||'')+'</textarea>';
  }
  else if(field.type==='acks'){
    field.items.forEach(function(it,idx){ var on=a&&a[idx];
      h+='<label class="chk-check'+(on?' sel':'')+'"><input type="checkbox" class="f-ack" data-ack="'+idx+'"'+(on?' checked':'')+'/> <span>'+esc(it)+'</span></label>'; });
  }
  h+='</div>';
  return h;
}

function selectedStop(){
  // returns an outcome key if any currently-selected option is a hard "stop"
  var step=STEPS[state.i], stop=null;
  step.fields.forEach(function(field){
    if(!field.notices) return;
    var fs=screenEl.querySelector('[data-field="'+field.key+'"]');
    var r=fs&&fs.querySelector('.opt input:checked');
    if(r && field.notices[r.value] && field.notices[r.value].type==='stop') stop=field.notices[r.value].outcome;
  });
  return stop;
}
function setNextLabel(){
  nextBtn.textContent = selectedStop() ? 'See result' : (state.i===STEPS.length-1 ? 'See my result' : 'Continue');
}

function applyNotice(field, fs, value){
  var nb=fs.querySelector('.chk-inline'); if(!nb||!field.notices) return;
  var n=field.notices[value];
  if(n){ nb.className='chk-inline show '+((n.type==='stop'||n.type==='danger')?'stop':'warn'); nb.innerHTML=esc(n.text); }
  else { nb.className='chk-inline'; nb.innerHTML=''; }
}

function wire(step){
  screenEl.querySelectorAll('.chk-fieldset').forEach(function(fs){
    var field=fieldByKey(step, fs.getAttribute('data-field'));
    fs.querySelectorAll('.opt input').forEach(function(r){
      r.addEventListener('change',function(){
        fs.querySelectorAll('.opt').forEach(function(l){l.classList.remove('sel');});
        r.closest('.opt').classList.add('sel');
        var ot=fs.querySelector('.f-other'); if(ot) ot.style.display=(r.value==='Other')?'block':'none';
        var fu=fs.querySelector('.f-fu'); if(fu&&field.followup) fu.style.display=(r.value===field.followup.when)?'block':'none';
        applyNotice(field, fs, r.value);
        setNextLabel();
        errEl.textContent='';
      });
    });
    fs.querySelectorAll('.chk-check input').forEach(function(c){
      c.addEventListener('change',function(){ c.closest('.chk-check').classList.toggle('sel',c.checked); errEl.textContent=''; });
    });
    // restore any notice when navigating back to a step
    var a=state.answers[fs.getAttribute('data-field')];
    if(field.notices && a && a.value) applyNotice(field, fs, a.value);
  });
}

function collectStep(step){
  var map={}, stop=null, error=null;
  step.fields.forEach(function(field){
    var fs=screenEl.querySelector('[data-field="'+field.key+'"]'), val;
    if(field.type==='consent' || field.type==='check'){ val=fs.querySelector('.f-check').checked; }
    else if(field.type==='single'){
      var r=fs.querySelector('.opt input:checked');
      val = r ? {value:r.value} : null;
      if(val){ var ot=fs.querySelector('.f-othertext'); if(ot) val.other=ot.value.trim();
               var fu=fs.querySelector('.f-futext'); if(fu) val.followup=fu.value.trim(); }
    }
    else if(field.type==='text'){ val=fs.querySelector('.f-text').value.trim(); }
    else if(field.type==='acks'){ var arr=[]; fs.querySelectorAll('.f-ack').forEach(function(c){arr[+c.getAttribute('data-ack')]=c.checked;}); val=arr; }
    map[field.key]=val;
    if(!error){ var e=validateField(field,val); if(e) error=e; }
    if(field.notices && val && val.value && field.notices[val.value] && field.notices[val.value].type==='stop') stop=field.notices[val.value].outcome;
  });
  return {map:map, stop:stop, error:error};
}

function validateField(field,val){
  if(field.type==='consent') return val?'':'Please confirm you understand to continue.';
  if(field.type==='check') return (field.gate&&field.gate.requireChecked)?(val?'':'This is required to proceed.'):'';
  if(field.type==='single'){ if(!val) return 'Please choose an option to continue.'; if(field.other&&val.value==='Other'&&!val.other) return 'Please tell us a little more.'; return ''; }
  if(field.type==='text') return field.optional?'':(val?'':'Please complete this to continue.');
  if(field.type==='acks') return field.items.every(function(_,i){return val[i];})?'':'Please confirm all points to continue.';
  return '';
}

/* Build a Red/Amber/Green summary of the clinical answers. */
function summarise(){
  var a=state.answers, items=[];
  function add(label,value,status,note){ items.push({label:label,value:value,status:status,note:note||''}); }

  var cond=a.condition&&a.condition.value;
  if(cond==='Other') add('Condition', a.condition.other||'Other', 'amber', 'We currently only prescribe for the conditions on our list.');
  else add('Condition', cond||'—', 'green');

  if(a.treatments&&a.treatments.value==='No') add('Tried two or more treatments', 'No', 'amber', 'Usually required before a specialist can prescribe.');
  else add('Tried two or more treatments', 'Yes', 'green');

  var age=a.age&&a.age.value;
  if(age==='18–25') add('Age', age, 'amber', 'We treat 18–25s only in exceptional circumstances.');
  else add('Age', age||'—', 'green');

  if(a.residency&&a.residency.value==='No') add('UK resident with a UK GP', 'No', 'amber', 'We can only prescribe for UK residents with a UK GP.');
  else add('UK resident with a UK GP', 'Yes', 'green');

  if(a.pregnancy&&a.pregnancy.value==='Yes') add('Pregnant / conceiving / breastfeeding', 'Yes', 'red', 'We don’t prescribe in this situation.');
  else add('Pregnant / conceiving / breastfeeding', (a.pregnancy&&a.pregnancy.value)||'No', 'green');

  if(a.psychosis&&a.psychosis.value==='Yes') add('Psychosis / schizophrenia history', 'Yes', 'amber', 'A history of psychosis makes prescribing unlikely.');
  else add('Psychosis / schizophrenia history', 'No', 'green');

  var overall = items.some(function(i){return i.status==='red';}) ? 'RED'
              : items.some(function(i){return i.status==='amber';}) ? 'AMBER' : 'GREEN';
  return {items:items, overall:overall};
}

function next(){
  var step=STEPS[state.i];
  var c=collectStep(step);
  if(c.error){ errEl.textContent=c.error; return; }
  for(var k in c.map){ state.answers[k]=c.map[k]; }
  if(c.stop){ showOutcome(c.stop); return; }     // e.g. Under 18 -> stop immediately
  if(state.i===STEPS.length-1){ showOutcome(); return; }
  state.i++; render();
}
function back(){ if(finished){ render(); return;} if(state.i>0){ state.i--; render(); } }

function showOutcome(forcedKey){
  finished=true;
  var summary = forcedKey ? null : summarise();
  var key = forcedKey || summary.overall;   // GREEN | AMBER | RED | HARD_STOP
  var o = OUTCOMES[key];
  barEl.style.width='100%'; pctEl.textContent='Result';
  actionsEl.style.display='none';
  var html='<div class="oc '+o.cls+'">';
  html+='<div class="badge">'+o.icon+'</div>';
  html+='<h2>'+esc(o.heading)+'</h2>';
  html+='<p>'+esc(o.body)+'</p>';

  // answer summary (skipped on the under-18 hard stop)
  if(summary){
    var ICON={green:'✓',amber:'!',red:'×'};
    html+='<ul class="oc-summary">';
    summary.items.forEach(function(it){
      html+='<li class="sm '+it.status+'"><span class="sm-ic">'+ICON[it.status]+'</span>'
        +'<span class="sm-body"><span class="sm-label">'+esc(it.label)+':</span>'
        +'<span class="sm-val">'+esc(it.value)+'</span>'
        +(it.note?'<span class="sm-note">'+esc(it.note)+'</span>':'')
        +'</span></li>';
    });
    html+='</ul>';
  }

  html+='<div class="oc-cta">';
  if(o.ctaLabel){
    html+='<a href="#" id="bookBtn" class="btn '+(o.ctaPrimary?'btn-leaf':'btn-ghost')+(o.ctaPrimary?'':' muted-cta')+'">'+esc(o.ctaLabel)+' <span class="arrow">→</span></a>';
  }
  html+='<a href="index.html" class="chk-back" style="text-decoration:underline">Back to True Leaf</a>';
  html+='</div></div>';
  screenEl.innerHTML=html;
  screenEl.focus&&screenEl.focus();

  var book=document.getElementById('bookBtn');
  if(book){
    book.addEventListener('click',function(e){
      e.preventDefault();
      // TODO(team): wire to the real booking journey.
      alert('Demo: this would now take you to booking.\n\nOutcome: '+key);
    });
  }
}

nextBtn.addEventListener('click',next);
backBtn.addEventListener('click',back);
document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && !finished && e.target.tagName!=='TEXTAREA'){ e.preventDefault(); next(); }
});
render();
</script>
</body>
</html>
