<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="True Leaf UK greenhouses">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f4"/>
      <stop offset="0.55" stop-color="#e8f1f8"/>
      <stop offset="1" stop-color="#f4f6fb"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe7f1"/>
      <stop offset="1" stop-color="#b9cfe0"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4d6e6"/>
      <stop offset="1" stop-color="#9fbcd2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- soft sun -->
  <circle cx="1230" cy="200" r="120" fill="#ffffff" opacity="0.55"/>
  <circle cx="1230" cy="200" r="70" fill="#ffffff" opacity="0.7"/>

  <!-- distant treeline -->
  <path d="M0 470 Q150 430 320 452 T640 442 T980 452 T1320 440 T1600 458 V520 H0 Z" fill="#6f9e7e" opacity="0.5"/>

  <!-- greenhouse blocks: rows of glass gable roofs -->
  <g>
    <!-- back row -->
    <g fill="url(#glassDark)" opacity="0.85">
      <polygon points="120,470 220,440 320,470 220,500"/>
      <polygon points="320,470 420,440 520,470 420,500"/>
      <polygon points="520,470 620,440 720,470 620,500"/>
      <polygon points="720,470 820,440 920,470 820,500"/>
      <polygon points="920,470 1020,440 1120,470 1020,500"/>
      <polygon points="1120,470 1220,440 1320,470 1220,500"/>
    </g>

    <!-- main greenhouse body -->
    <rect x="120" y="470" width="1360" height="240" fill="url(#glass)"/>
    <!-- gable roof teeth -->
    <g fill="#e4eef6" stroke="#a9c3d6" stroke-width="2">
      <polygon points="120,470 220,432 320,470"/>
      <polygon points="320,470 420,432 520,470"/>
      <polygon points="520,470 620,432 720,470"/>
      <polygon points="720,470 820,432 920,470"/>
      <polygon points="920,470 1020,432 1120,470"/>
      <polygon points="1120,470 1220,432 1320,470"/>
      <polygon points="1320,470 1420,432 1480,455 1480,470"/>
    </g>
    <!-- vertical glazing bars -->
    <g stroke="#a9c3d6" stroke-width="2" opacity="0.7">
      <line x1="180" y1="470" x2="180" y2="710"/>
      <line x1="260" y1="470" x2="260" y2="710"/>
      <line x1="340" y1="470" x2="340" y2="710"/>
      <line x1="420" y1="470" x2="420" y2="710"/>
      <line x1="500" y1="470" x2="500" y2="710"/>
      <line x1="580" y1="470" x2="580" y2="710"/>
      <line x1="660" y1="470" x2="660" y2="710"/>
      <line x1="740" y1="470" x2="740" y2="710"/>
      <line x1="820" y1="470" x2="820" y2="710"/>
      <line x1="900" y1="470" x2="900" y2="710"/>
      <line x1="980" y1="470" x2="980" y2="710"/>
      <line x1="1060" y1="470" x2="1060" y2="710"/>
      <line x1="1140" y1="470" x2="1140" y2="710"/>
      <line x1="1220" y1="470" x2="1220" y2="710"/>
      <line x1="1300" y1="470" x2="1300" y2="710"/>
      <line x1="1380" y1="470" x2="1380" y2="710"/>
      <line x1="1460" y1="470" x2="1460" y2="710"/>
    </g>
    <!-- horizontal rail -->
    <line x1="120" y1="560" x2="1480" y2="560" stroke="#a9c3d6" stroke-width="2" opacity="0.7"/>
    <!-- green crop glimpsed through glass -->
    <rect x="122" y="600" width="1356" height="108" fill="#6aa97f" opacity="0.35"/>
  </g>

  <!-- grassy foreground -->
  <path d="M0 700 Q400 680 800 706 T1600 700 V900 H0 Z" fill="#5f9772"/>
  <path d="M0 760 Q500 740 1000 766 T1600 762 V900 H0 Z" fill="#4e8a63"/>
</svg>
