      <stop offset="0" stop-color="#16306E"/><stop offset="1" stop-color="#0B1240"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <path d="M40 70 h160 v76 a80 24 0 0 1 -160 0 z" fill="url(#gb)"/>
  <line x1="48" y1="78" x2="48" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="59" y1="78" x2="59" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="70" y1="78" x2="70" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="81" y1="78" x2="81" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="92" y1="78" x2="92" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="103" y1="78" x2="103" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="114" y1="78" x2="114" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="125" y1="78" x2="125" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="136" y1="78" x2="136" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="147" y1="78" x2="147" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="158" y1="78" x2="158" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="169" y1="78" x2="169" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="180" y1="78" x2="180" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/><line x1="191" y1="78" x2="191" y2="150" stroke="#0a1a44" stroke-width="3" opacity="0.55"/>
  <!-- seam between halves -->
  <ellipse cx="120" cy="112" rx="80" ry="22" fill="none" stroke="#0a1a44" stroke-width="2"/>
  <!-- top lid -->
  <ellipse cx="120" cy="70" rx="80" ry="26" fill="#1B2766"/>
  <ellipse cx="120" cy="70" rx="80" ry="26" fill="none" stroke="#2c3a82" stroke-width="2"/>
